name: AlofoK Expo diagnostics — NO BUILD

on:
  push:
    branches:
      - audit-no-build-2026-09-13
    paths:
      - .github/audit-expo-diagnostics.trigger

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-no-build-2026-09-13
          fetch-depth: 0
      - name: Re-apply source-only layout repair
        run: python3 scripts/apply_audit_round3_no_build_20260913.py
      - name: Install JS dependencies only
        run: npm ci --ignore-scripts
      - name: Static checks
        run: |
          node scripts/release-qa.js
          node scripts/check-translations.js
      - name: Capture Expo Doctor report
        shell: bash
        run: |
          set +e
          npx expo-doctor@latest > AUDIT_EXPO_DOCTOR_2026-09-13.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> AUDIT_EXPO_DOCTOR_2026-09-13.txt
          exit 0
      - name: Capture Expo dependency check
        shell: bash
        run: |
          set +e
          npx expo install --check > AUDIT_EXPO_INSTALL_CHECK_2026-09-13.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> AUDIT_EXPO_INSTALL_CHECK_2026-09-13.txt
          exit 0
      - name: Capture Trial Expo config
        env:
          APP_VARIANT: trial
          EXPO_PUBLIC_APP_VARIANT: trial
        run: npx expo config --type public > AUDIT_EXPO_CONFIG_TRIAL_2026-09-13.txt
      - name: Capture Plus Expo config
        env:
          APP_VARIANT: paid
          EXPO_PUBLIC_APP_VARIANT: paid
          EXPO_PUBLIC_LICENSE_DEV_BYPASS: '1'
        run: npx expo config --type public > AUDIT_EXPO_CONFIG_PLUS_2026-09-13.txt
      - name: Commit diagnostics and source-only layout repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.js scripts/release-qa.js AUDIT_EXPO_DOCTOR_2026-09-13.txt AUDIT_EXPO_INSTALL_CHECK_2026-09-13.txt AUDIT_EXPO_CONFIG_TRIAL_2026-09-13.txt AUDIT_EXPO_CONFIG_PLUS_2026-09-13.txt
          git diff --cached --quiet && exit 0
          git commit -m "audit: capture Expo diagnostics without building"
          git push origin audit-no-build-2026-09-13
      - name: Confirm no build
        run: echo "Diagnostics only; no expo prebuild, Gradle, EAS build, APK or AAB command ran."
