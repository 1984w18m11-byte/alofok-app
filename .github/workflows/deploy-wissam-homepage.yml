name: Deploy Wissam Digital homepage

on:
  push:
    paths:
      - '.github/deploy-wissam-homepage.trigger'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact requested homepage changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('wissam-digital-site/public/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<label data-ar>تحميل الصور المطلوبة (اختياري)</label><label data-en>Add required images (optional)</label>','<label data-ar>إرفاق مستندات أو صور (اختياري)</label><label data-en>Attach documents or images (optional)</label>')
          s=s.replace('<label data-ar>إرفاق ملفات أو صور (اختياري)</label><label data-en>Attach files or images (optional)</label>','<label data-ar>إرفاق مستندات أو صور (اختياري)</label><label data-en>Attach documents or images (optional)</label>')
          s=s.replace('accept="image/*" multiple','accept="image/*,.pdf,.doc,.docx,.txt" multiple')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit homepage changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wissam-digital-site/public/index.html wissam-digital-site/public/app.js
          if ! git diff --cached --quiet; then
            git commit -m "site: show AlofoK download and document attachments"
            git push origin main
          fi

      - name: Resolve Cloudflare account
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is missing"
            exit 1
          fi
          account_id="${CLOUDFLARE_ACCOUNT_ID_SECRET:-}"
          if [ -z "$account_id" ]; then
            account_id="$(curl -fsS https://api.cloudflare.com/client/v4/accounts \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result') or []; print(r[0]['id'] if r else '')")"
          fi
          if [ -z "$account_id" ]; then
            echo "Could not resolve Cloudflare account ID"
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare Workers with Wrangler 4
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd wissam-digital-site
          npx -y wrangler@4 deploy --config wrangler.jsonc
