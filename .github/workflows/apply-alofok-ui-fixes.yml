name: Apply AlofoK requested updates

on:
  push:
    paths:
      - '.github/workflows/apply-alofok-ui-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply requested code changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('App.js')
          app = app_path.read_text()

          def repl(old, new, count=None):
              global app
              hits = app.count(old)
              if hits == 0:
                  raise SystemExit(f'Expected App.js text not found: {old[:120]!r}')
              if count is not None and hits != count:
                  raise SystemExit(f'Unexpected match count {hits} for: {old[:120]!r}')
              app = app.replace(old, new)

          repl("const SUPPORT_ACCOUNT='';", "const SUPPORT_ACCOUNT=process.env.EXPO_PUBLIC_SUPPORT_ACCOUNT||'';", 1)
          repl(" const [method,setMethod]=useState('MWL');", " const method='MWL';", 1)
          repl(" const [showMainMenu,setShowMainMenu]=useState(false);", " const [showMainMenu,setShowMainMenu]=useState(false);\n const [showSupportAccount,setShowSupportAccount]=useState(false);", 1)
          repl("    if(PRAYER_METHODS.some(([id])=>id===savedMethod))setMethod(savedMethod);", "    // Prayer calculation is intentionally fixed in AlofoK; old saved method preferences are ignored.", 1)
          repl("   method,\n   asrFactor:1\n }),[coords.lat,coords.lon,prayerCalcDate,method,tzOffsetMin]);", "   method:'MWL',\n   asrFactor:1\n }),[coords.lat,coords.lon,prayerCalcDate,tzOffsetMin]);", 1)
          repl("      <Text style={s.appSub}>تقويم عربي ثابت ومواقيت الصلاة</Text>", "      <Text style={s.appSub}>تقويم الأفق — التقويم العربي الثابت</Text>", 1)
          repl("     <Pressable style={s.mainMenuItem} onPress={()=>Alert.alert('دعم تطوير الأفق','رقم الدعم وخيار النسخ موجودان في الصفحة الرئيسية.')}><Text style={s.mainMenuText}>$  دعم تطوير الأفق</Text></Pressable>", "     <Pressable style={s.mainMenuItem} onPress={()=>{setShowSupportAccount(v=>!v);setShowMainMenu(false)}}><Text style={s.mainMenuText}>$  دعمكم لتطوير برنامج الأفق</Text></Pressable>", 1)
          repl("    </View>}\n   </View>}\n   {tab==='today'&&<>", "    </View>}\n    <View style={s.supportQuickWrap}>\n     <Pressable accessibilityLabel='دعمكم لتطوير برنامج الأفق' style={s.supportButton} onPress={()=>setShowSupportAccount(v=>!v)}><Text style={s.supportButtonText}>$  دعمكم لتطوير برنامج الأفق</Text></Pressable>\n     {showSupportAccount&&<View style={s.supportMiniPanel}><Text selectable style={s.supportMiniAccount}>{SUPPORT_ACCOUNT||'سيُضاف رقم الدعم لاحقًا'}</Text><Pressable accessibilityLabel='نسخ رقم الدعم' style={[s.supportMiniCopy,!SUPPORT_ACCOUNT&&s.copyButtonDisabled]} onPress={copySupportAccount}><Text style={s.supportMiniCopyText}>نسخ</Text></Pressable></View>}\n    </View>\n   </View>}\n   {tab==='today'&&<>", 1)
          repl("  <Text style={s.researchIdentity}>تقويم عربي ثابت — بحث علمي مقترح، وليس تقويمًا شرعيًا رسميًا</Text>", "  <Text style={s.researchIdentity}>تقويم الأفق — التقويم العربي الثابت • بحث علمي، وليس تقويمًا شرعيًا رسميًا</Text>", 1)

          old_support = """    <View style={s.supportCard}>\n     <View style={s.supportHeading}><Text style={s.supportTitle}>دعم تطوير الأفق</Text><Text style={s.supportDollar}>$</Text></View>\n     <Text style={s.supportDescription}>دعم اختياري لاستمرار تطوير التطبيق. حدّد المبلغ من محفظتك دون مبالغ مقترحة.</Text>\n     <View style={s.supportAccountRow}>\n      <Text selectable style={s.supportAccount}>{SUPPORT_ACCOUNT||'سيُضاف رقم الدعم لاحقًا'}</Text>\n      <Pressable accessibilityLabel='نسخ رقم الدعم' style={[s.copyButton,!SUPPORT_ACCOUNT&&s.copyButtonDisabled]} onPress={copySupportAccount}><Text style={s.copyButtonIcon}>▣</Text><Text style={s.copyButtonText}>نسخ</Text></Pressable>\n     </View>\n    </View>\n    \n"""
          repl(old_support, "", 1)

          repl("     <Text style={s.researchNotice}>نسخة بحثية تقديرية وليست تقويمًا شرعيًا أو رسميًا معتمدًا.</Text>", "     <Text style={s.researchNotice}>{calendarView.isLeapYear?'السنة الكبيسة: 13 شهرًا، والشهر الثالث عشر هو شهر النسيء.':'السنة العادية: 12 شهرًا.'}</Text>", 1)

          calc_pattern = re.compile(r"\n    <SettingsCard title=\{t\('calculation'\)\}><View style=\{s\.wrap\}>\{PRAYER_METHODS\.map\(\(\[id,label\]\)=>.*?</SettingsCard>", re.S)
          app, n = calc_pattern.subn('', app, count=1)
          if n != 1:
              raise SystemExit(f'Expected one prayer calculation settings card, removed {n}')

          style_anchor = " adActionText:{color:'#111820',fontWeight:'900',textAlign:'center'}\n});"
          style_replacement = """ adActionText:{color:'#111820',fontWeight:'900',textAlign:'center'},\n supportQuickWrap:{alignItems:'flex-end',marginTop:3},\n supportButton:{alignSelf:'flex-end',minHeight:34,paddingVertical:7,paddingHorizontal:10,borderRadius:10,borderWidth:1,borderColor:'#b98532',backgroundColor:'rgba(28,20,8,.88)'},\n supportButtonText:{color:'#f4bb52',fontSize:12,fontWeight:'900',textAlign:'center'},\n supportMiniPanel:{alignSelf:'flex-end',flexDirection:'row-reverse',alignItems:'center',gap:7,marginTop:6,padding:6,borderRadius:10,borderWidth:1,borderColor:'#4b5961',backgroundColor:'rgba(2,16,24,.94)'},\n supportMiniAccount:{minWidth:125,maxWidth:205,color:'#fff',fontSize:12,fontWeight:'800',textAlign:'center',paddingHorizontal:7},\n supportMiniCopy:{minWidth:48,minHeight:32,paddingHorizontal:9,borderRadius:8,backgroundColor:'#efb44d',alignItems:'center',justifyContent:'center'},\n supportMiniCopyText:{color:'#111820',fontSize:11,fontWeight:'900'}\n});"""
          repl(style_anchor, style_replacement, 1)

          app_path.write_text(app)

          tr_path = Path('src/i18n/translations.js')
          tr = tr_path.read_text()
          tr = re.sub(r"arabicCalendar:'[^']*'", "arabicCalendar:'AlofoK Calendar'", tr)
          tr = re.sub(r"(ar:\{[^\n]*?arabicCalendar:)'AlofoK Calendar'", r"\1'تقويم الأفق'", tr, count=1)
          tr = tr.replace("prayerHint:'مواقيت اليوم حسب موقعك الحالي'", "prayerHint:'مواقيت الصلاة محسوبة بطريقة ثابتة، وتتغيّر أوقاتها حسب اليوم والشهر والموقع'", 1)
          tr_path.write_text(tr)

          lunar = r'''import {findConjunctionNear} from './astronomy';

export const MONTHS_AR=['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة','شهر النسيء'];
export const MONTHS_EN=['Muharram','Safar','Rabi I','Rabi II','Jumada I','Jumada II','Rajab',"Sha'ban",'Ramadan','Shawwal','Dhu al-Qidah','Dhu al-Hijjah','Nasi Month'];
const SYNODIC=29.530588853;
const DAY=86400000;
const EPOCH_RESEARCH_YEAR=1448;
const EPOCH_GREGORIAN_YEAR=2026;
const LEAP_POSITIONS=new Set([2,5,7,10,13,16,18]);

export const SEASONAL_POLICY={
  anchor:'Ramadan',
  targetWindow:{startMonth:9,startDay:8,endMonth:10,endDay:7},
  intercalation:'A 19-year research cycle uses seven leap years. A leap year has 13 months; the thirteenth month is شهر النسيء.',
  rule:'Research implementation: anchor the epoch Ramadan near the September seasonal window, then preserve the lunar months with periodic intercalation. Local crescent validation remains a separate layer.'
};

function cyclePosition(year){
  return ((Number(year)-EPOCH_RESEARCH_YEAR)%19+19)%19+1;
}

export function isLunisolarLeapYear(year){
  return LEAP_POSITIONS.has(cyclePosition(year));
}

export function monthsInLunisolarYear(year){
  return isLunisolarLeapYear(year)?13:12;
}

export function monthName(index,lang='ar'){
  const arr=lang==='ar'?MONTHS_AR:MONTHS_EN;
  return arr[index-1]||'';
}

function ramadanAnchorForGregorianYear(year){
  const target=new Date(Date.UTC(year,8,22,12,0,0));
  const conjunction=findConjunctionNear(target);
  return new Date(conjunction.getTime()+DAY);
}

function epochMuharramStart(){
  const ramadan=ramadanAnchorForGregorianYear(EPOCH_GREGORIAN_YEAR);
  return new Date(ramadan.getTime()-8*SYNODIC*DAY);
}

function yearLengthDays(year){
  return monthsInLunisolarYear(year)*SYNODIC;
}

function startOfResearchYear(year){
  let t=epochMuharramStart().getTime();
  if(year>=EPOCH_RESEARCH_YEAR){
    for(let y=EPOCH_RESEARCH_YEAR;y<year;y++)t+=yearLengthDays(y)*DAY;
  }else{
    for(let y=EPOCH_RESEARCH_YEAR-1;y>=year;y--)t-=yearLengthDays(y)*DAY;
  }
  return new Date(t);
}

function locateResearchYear(date){
  let year=EPOCH_RESEARCH_YEAR+Math.round((date.getUTCFullYear()-EPOCH_GREGORIAN_YEAR));
  let start=startOfResearchYear(year);
  while(date<start){year-=1;start=startOfResearchYear(year)}
  let next=startOfResearchYear(year+1);
  while(date>=next){year+=1;start=next;next=startOfResearchYear(year+1)}
  return {year,start,next};
}

export function proposedLunisolarDate(date=new Date()){
  const {year,start}=locateResearchYear(date);
  const days=(date-start)/DAY;
  const maxMonths=monthsInLunisolarYear(year);
  let month=Math.floor(days/SYNODIC)+1;
  month=Math.max(1,Math.min(maxMonths,month));
  const monthStart=new Date(start.getTime()+(month-1)*SYNODIC*DAY);
  const day=Math.max(1,Math.min(30,Math.floor((date-monthStart)/DAY)+1));
  const leap=isLunisolarLeapYear(year);
  return {
    year,month,day,
    monthNameAr:MONTHS_AR[month-1],
    estimated:true,
    start,
    isLeapYear:leap,
    yearTypeAr:leap?'السنة الكبيسة':'السنة العادية',
    monthsInYear:leap?13:12
  };
}

export function lunisolarMonthLength(date=new Date()){
  const current=proposedLunisolarDate(date);
  const first=new Date(date);
  first.setUTCDate(first.getUTCDate()-(current.day-1));
  for(let n=29;n<=30;n++){
    const probe=new Date(first);
    probe.setUTCDate(probe.getUTCDate()+n);
    const x=proposedLunisolarDate(probe);
    if(x.month!==current.month||x.year!==current.year)return n;
  }
  return 30;
}

export function addLunisolarMonths(date,delta){
  const current=proposedLunisolarDate(date);
  let year=current.year;
  let month=current.month;
  const steps=Math.trunc(delta);
  const direction=steps>=0?1:-1;
  for(let i=0;i<Math.abs(steps);i++){
    if(direction>0){
      if(month<monthsInLunisolarYear(year))month+=1;
      else{year+=1;month=1}
    }else{
      if(month>1)month-=1;
      else{year-=1;month=monthsInLunisolarYear(year)}
    }
  }
  const start=startOfResearchYear(year);
  const target=new Date(start.getTime()+((month-1)*SYNODIC+(current.day-1))*DAY);
  const targetInfo=proposedLunisolarDate(target);
  if(targetInfo.month!==month||targetInfo.year!==year){
    return new Date(start.getTime()+(month-1)*SYNODIC*DAY);
  }
  return target;
}

export function addLunisolarYears(date,delta){
  const current=proposedLunisolarDate(date);
  const year=current.year+Math.trunc(delta);
  const month=Math.min(current.month,monthsInLunisolarYear(year));
  const start=startOfResearchYear(year);
  const target=new Date(start.getTime()+((month-1)*SYNODIC+(current.day-1))*DAY);
  const info=proposedLunisolarDate(target);
  if(info.year!==year||info.month!==month)return new Date(start.getTime()+(month-1)*SYNODIC*DAY);
  return target;
}
'''
          Path('src/engine/lunisolar.js').write_text(lunar)

          # Sanity checks for the requested UI/model changes.
          app = app_path.read_text()
          assert 'دعمكم لتطوير برنامج الأفق' in app
          assert "title={t('calculation')}" not in app
          assert "method:'MWL'" in app
          assert 'السنة الكبيسة: 13 شهرًا' in app
          assert 'تقويم الأفق — التقويم العربي الثابت' in app
          assert 'شهر النسيء' in Path('src/engine/lunisolar.js').read_text()
          PY

      - name: Commit requested changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.js src/i18n/translations.js src/engine/lunisolar.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: update AlofoK calendar, fixed prayer method and compact support"
          git push
