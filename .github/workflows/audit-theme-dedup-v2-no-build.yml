name: AlofoK theme dedup v2 — NO BUILD

on:
  push:
    branches:
      - audit-no-build-2026-09-13
    paths:
      - .github/audit-theme-dedup-v2.trigger

permissions:
  contents: write

jobs:
  deduplicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-no-build-2026-09-13
          fetch-depth: 0
      - name: Install Pillow
        run: python3 -m pip install --quiet pillow
      - name: Replace duplicate licensed theme files
        run: python3 scripts/deduplicate_theme_assets_v2_20260913.py
      - name: Static source QA
        run: node scripts/release-qa.js
      - name: Commit asset repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/themes
          git diff --cached --quiet && exit 0
          git commit -m "themes: replace duplicated licensed theme images"
          git pull --rebase origin audit-no-build-2026-09-13
          git push origin audit-no-build-2026-09-13
      - name: Confirm no application build
        run: echo "Theme assets only. No Expo prebuild, Gradle, EAS, APK or AAB build ran."
