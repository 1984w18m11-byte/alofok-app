name: Build Fahima APK

on:
  push:
    branches: [ "fahima-build" ]
    paths:
      - "fahima/**"
      - ".github/workflows/fahima-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build APK
        working-directory: fahima
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare artifact
        run: cp fahima/app/build/outputs/apk/debug/app-debug.apk Fahima-0.1.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Fahima-0.1.0-debug
          path: Fahima-0.1.0-debug.apk
          if-no-files-found: error
