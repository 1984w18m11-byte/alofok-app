name: One-off add drawer X

on:
  push:
    branches:
      - stable-rebuild-from-v1.0.13
    paths:
      - .github/workflows/oneoff-add-drawer-x.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable-rebuild-from-v1.0.13
      - name: Add close X to drawer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app/AppV3.js')
          s=p.read_text()
          old="    <IconButton label={t('back')} onPress={onClose}>{rtl?'›':'‹'}</IconButton>\n"
          new=old+"    <Pressable accessibilityLabel={t('close')} onPress={onClose} style={s.drawerClose}><Text style={s.drawerCloseText}>×</Text></Pressable>\n"
          if new in s:
              raise SystemExit(0)
          if old not in s:
              raise SystemExit('drawer back button anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneoff-add-drawer-x.yml
          git add src/app/AppV3.js
          git commit -m "Add close X to side drawer"
          git push origin HEAD:stable-rebuild-from-v1.0.13
