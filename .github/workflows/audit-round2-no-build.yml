name: AlofoK audit round 2 — NO BUILD

on:
  push:
    branches:
      - audit-no-build-2026-09-13
    paths:
      - .github/audit-round2.trigger

permissions:
  contents: write

jobs:
  repair-source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-no-build-2026-09-13
          fetch-depth: 0
      - name: Apply second source-only audit repairs
        run: python3 scripts/apply_audit_round2_no_build_20260913.py
      - name: Run static release QA only
        run: node scripts/release-qa.js
      - name: Run translation-key QA only
        run: node scripts/check-translations.js
      - name: Commit repaired source to audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.js src/services/license.js scripts/release-qa.js
          git diff --cached --quiet && exit 0
          git commit -m "audit: harden activation and pre-schedule alerts"
          git push origin audit-no-build-2026-09-13
      - name: Confirm no build
        run: echo "No Expo prebuild, Gradle, EAS, APK or AAB build command ran."
