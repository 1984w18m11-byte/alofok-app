name: Apply Adhan volume fix

on:
  push:
    paths:
      - .github/adhan-volume-fix.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Adhan volume fix
        run: node scripts/apply-adhan-volume-fix.js
      - name: Validate translations
        run: npm run check:translations
      - name: Run release QA
        run: npm run check:release
      - name: Commit integrated source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/AppV3.js src/app/useAdhanAudio.js src/app/v3Strings.js scripts/release-qa.js
          git commit -m "fix(audio): make Adhan volume control work in Trial and Plus"
          git push origin HEAD:main
