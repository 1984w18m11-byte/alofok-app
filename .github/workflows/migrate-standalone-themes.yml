name: Migrate AlofoK standalone themes

on:
  push:
    paths:
      - '.github/alofok-standalone-themes.trigger'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow

      - name: Harden migration script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/migrate_standalone_themes.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("'time-dawn.jpg':'dawn landscape sunrise mosque photograph'","'time-dawn.jpg':'sunrise landscape photograph'")
          s=s.replace("'time-night.jpg':'night mosque moon stars photograph'","'time-night.jpg':'night sky stars landscape photograph'")
          s=s.replace("'month-muharram.jpg':'Islamic architecture night peaceful photograph'","'month-muharram.jpg':'mosque architecture night photograph'")
          start=s.index('def http_json(url):')
          end=s.index('\ndef download(url):',start)
          robust="""def http_json(url):
              last=None
              for attempt in range(6):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':UA})
                      with urllib.request.urlopen(req,timeout=35) as r:
                          return json.loads(r.read().decode('utf-8'))
                  except Exception as e:
                      last=e
                      if getattr(e,'code',None)==429 and attempt<5:
                          time.sleep(8*(attempt+1))
                          continue
                      raise
              raise last
          """
          s=s[:start]+robust+s[end:]
          s=s.replace('time.sleep(0.2)','time.sleep(1.8)')
          lines=[]
          for line in s.splitlines():
              if line.strip().startswith('qa,n=re.subn(') and "replacement+'const configuredSounds='" in line:
                  line=line.replace(",replacement+'const configuredSounds=',qa,count=1)",",lambda _m: replacement+'const configuredSounds=',qa,count=1)")
              lines.append(line)
          s='\n'.join(lines)+'\n'
          marker="(THEME_DIR/'theme-sources.json').write_text"
          pos=s.index(marker)
          guard="missing_sources=[name for name,meta in sources.items() if not meta.get('page_url')]\nif missing_sources:\n    raise RuntimeError('Licensed image source unavailable for: '+', '.join(missing_sources))\n"
          s=s[:pos]+guard+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY

      - name: Download licensed standalone images and migrate source
        run: python scripts/migrate_standalone_themes.py

      - name: Align release QA with new theme label
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/release-qa.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("assert(app.includes(\"Automatic rotation by time, week, month and season\"),'automatic theme rotation label missing');","assert(app.includes(\"Automatic: time + weekday + season\"),'automatic theme rotation label missing');")
          p.write_text(s,encoding='utf-8')
          PY

      - name: Run release QA
        run: node scripts/release-qa.js

      - name: Clean staging markers
        run: |
          rm -f .github/test.txt
          rm -f .github/STOP_BUILD_UNTIL_THEME_MIGRATION_COMPLETE
          rm -f .github/theme-migration-status.json
          rm -f .github/alofok-theme-migration-note.txt
          rm -f scripts/theme_migration_placeholder.py
          rm -f scripts/THEME_MIGRATION_PLAN.md
          rm -f assets/themes/.placeholder

      - name: Commit standalone themes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- App.js scripts/release-qa.js assets/themes .github scripts
          git diff --cached --quiet && exit 0
          git commit -m "themes: replace atlas with 34 standalone Plus themes"
          git push origin main
