name: Apply trial advertising integration

on:
  push:
    paths:
      - .github/trial-ads.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply advertising patch
        run: node scripts/apply-trial-ads.mjs
      - name: Validate translations
        run: npm run check:translations
      - name: Run release QA
        run: npm run check:release
      - name: Commit integrated source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/AppV3.js src/app/v3Strings.js scripts/release-qa.js
          git commit -m "feat(ads): add moderated Trial ads with weekly cap"
          git push
