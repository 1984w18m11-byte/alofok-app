name: Apply AlofoK 0.5.8 source patch

on:
  push:
    paths:
      - '.github/alofok-source-update.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install icon generation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil fonts-noto-core libraqm0

      - name: Normalize Arabic icon font path
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('scripts/apply_release_058.py'); s=p.read_text(encoding='utf-8'); old1=\"font_title=ImageFont.truetype('/usr/share/fonts/truetype/noto/NotoKufiArabic-ExtraBold.ttf',118)\"; old2=\"font_sub=ImageFont.truetype('/usr/share/fonts/truetype/noto/NotoKufiArabic-Medium.ttf',51)\"; new1=\"font_file=next(iter(Path('/usr/share/fonts').rglob('NotoKufiArabic-Regular.ttf')), None) or next(iter(Path('/usr/share/fonts').rglob('NotoSansArabic-Regular.ttf')), None) or next(iter(Path('/usr/share/fonts').rglob('DejaVuSans.ttf')), None); font_title=ImageFont.truetype(str(font_file),118)\"; new2=\"font_sub=ImageFont.truetype(str(font_file),51)\"; s=s.replace(old1,new1).replace(old2,new2); p.write_text(s,encoding='utf-8')"

      - name: Apply AlofoK 0.5.8 update
        run: python3 scripts/apply_release_058.py

      - name: Keep externally managed build workflow unchanged
        run: git restore --source=HEAD -- .github/workflows/build-apks.yml

      - name: Run source QA
        run: node scripts/release-qa.js

      - name: Commit updated source and assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "release: prepare AlofoK 0.5.8 icons themes and Adhan refresh"
          git push origin main
