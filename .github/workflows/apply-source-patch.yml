name: Apply AlofoK 0.5.8 source patch

on:
  push:
    paths:
      - '.github/alofok-source-update.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install icon generation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil fonts-noto-core libraqm0

      - name: Apply AlofoK 0.5.8 update
        run: python3 scripts/apply_release_058.py

      - name: Run source QA
        run: node scripts/release-qa.js

      - name: Commit updated source and assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "release: prepare AlofoK 0.5.8 icons themes and Adhan refresh"
          git push origin main
