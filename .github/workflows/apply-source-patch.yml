name: Apply AlofoK source patch

on:
  push:
    paths:
      - '.github/alofok-source-update.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply consolidated release repair
        run: python3 scripts/apply_release_057.py
      - name: Run release QA
        run: node scripts/release-qa.js
      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.js app.json app.config.js package.json package-lock.json update-trial.json update-plus.json src/engine/prayer.js src/data/events.json src/data/national-events.json src/data/adhan-registry.json
          git diff --cached --quiet && exit 0
          git commit -m "release: prepare AlofoK 0.5.7 after full QA"
          git push origin main
