name: Apply AlofoK source patch

on:
  push:
    paths:
      - '.github/alofok-source-update.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply final device QA patch
        run: python3 scripts/apply_final_qa_fix.py
      - name: Apply second English QA pass
        run: python3 scripts/apply_final_qa_fix_2.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.js app.json app.config.js src/i18n/translations.js src/engine/lunisolar.js src/services/license.js src/data/adhan-registry.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: final device QA for language variants themes and adhan"
          git push origin main
