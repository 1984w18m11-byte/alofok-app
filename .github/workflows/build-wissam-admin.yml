name: Build Wissam Digital Admin

on:
  workflow_dispatch:
  push:
    paths:
      - .github/wissam-admin.trigger

permissions:
  contents: write

jobs:
  build-admin:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: "1"
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve Cloudflare account
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          account_id="${CLOUDFLARE_ACCOUNT_ID_SECRET:-}"
          if [ -z "$account_id" ]; then
            account_id="$(curl -fsS https://api.cloudflare.com/client/v4/accounts               -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"               -H 'Content-Type: application/json' | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result') or []; print(r[0]['id'] if r else '')")"
          fi
          test -n "$account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Deploy activation backend
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          cd wissam-digital-site
          npx -y wrangler@4 deploy --config wrangler.jsonc

      - name: Create private admin credential
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ADMIN_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$ADMIN_TOKEN"
          echo "WISSAM_ADMIN_TOKEN=$ADMIN_TOKEN" >> "$GITHUB_ENV"
          cd wissam-digital-site
          printf '%s' "$ADMIN_TOKEN" | npx -y wrangler@4 secret put ADMIN_TOKEN --config wrangler.jsonc

      - name: Verify live visit and al ufuq download statistics
        shell: bash
        run: |
          set -euo pipefail
          base='https://wispy-salad-438b.wissamdigital11.workers.dev'
          auth="Authorization: Bearer ${WISSAM_ADMIN_TOKEN}"
          before="$(curl -fsS -H "$auth" "$base/api/admin/site/stats")"
          curl -fsS -o /dev/null -X POST -H 'Content-Type: application/json' \
            --data '{"event":"page_view","path":"/qa","source":"GitHub Actions","sessionId":"release-qa"}' \
            "$base/api/track"
          headers="$(curl -fsS -D - -o /dev/null "$base/download/alofok-trial?sid=release-qa&src=GitHub-Actions")"
          printf '%s' "$headers" | grep -qi 'location: .*v1.0.13/Al-Ufuq-Trial-1.0.13.apk'
          after="$(curl -fsS -H "$auth" "$base/api/admin/site/stats")"
          BEFORE="$before" AFTER="$after" node - <<'NODE'
          const before=JSON.parse(process.env.BEFORE),after=JSON.parse(process.env.AFTER);
          for(const side of ['today','totals']){
            if(after[side].visits<before[side].visits+1)throw new Error(`${side}.visits did not increase`);
            if(after[side].alofokDownloads<before[side].alofokDownloads+1)throw new Error(`${side}.alofokDownloads did not increase`);
          }
          console.log(JSON.stringify({before,after,apk:'1.0.13',result:'PASS'}));
          NODE

      - name: Install admin dependencies
        working-directory: wissam-digital-admin
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        working-directory: wissam-digital-admin
        env:
          EXPO_PUBLIC_ADMIN_API_URL: "https://wispy-salad-438b.wissamdigital11.workers.dev"
          EXPO_PUBLIC_ADMIN_TOKEN: ${{ env.WISSAM_ADMIN_TOKEN }}
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build admin APK
        working-directory: wissam-digital-admin/android
        env:
          EXPO_PUBLIC_ADMIN_API_URL: "https://wispy-salad-438b.wissamdigital11.workers.dev"
          EXPO_PUBLIC_ADMIN_TOKEN: ${{ env.WISSAM_ADMIN_TOKEN }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare admin APK
        shell: bash
        run: cp wissam-digital-admin/android/app/build/outputs/apk/release/app-release.apk wissam-digital-admin-0.1.1.apk

      - name: Publish private-use admin build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view wissam-admin-v0.1.1 --repo 1984w18m11-byte/alofok-app >/dev/null 2>&1 ||             gh release create wissam-admin-v0.1.1 --repo 1984w18m11-byte/alofok-app --title "Wissam Digital Admin 0.1.1" --notes "تطبيق الإدارة الخاص بوسام ديجيتال 0.1.1 — تبويبات الطلبات والمقبولة والمرفوضة مع إحصائيات زيارات وتحميلات الموقع."
          gh release upload wissam-admin-v0.1.1 wissam-digital-admin-0.1.1.apk --repo 1984w18m11-byte/alofok-app --clobber
