name: Update Wissam Digital homepage

on:
  push:
    paths:
      - '.github/wissam-homepage.trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply homepage patch
        run: python3 scripts/update_wissam_homepage_upload.py

      - name: Commit homepage changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wissam-digital-site/public/index.html wissam-digital-site/public/app.js wissam-digital-site/.cloudflare-refresh-20260916-2.txt
          git diff --cached --quiet && exit 0
          git commit -m "site: show AlofoK download and contact file uploads"
          git push origin main
