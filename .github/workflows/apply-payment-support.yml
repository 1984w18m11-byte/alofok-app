name: Apply payment and support source preparation

on:
  push:
    paths:
      - '.github/payment-support.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply payment and support source changes
        run: python3 scripts/apply_payment_support_update.py

      - name: Commit prepared source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/AppV3.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: connect support and Plus transfer screens"
          git push origin main
