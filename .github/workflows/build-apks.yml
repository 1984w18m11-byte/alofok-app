name: Validate and build Android APKs

on:
  workflow_dispatch:
  push:
    paths:
      - .github/build-apks.trigger

permissions:
  contents: write

jobs:
  build-apk:
    name: Build AlofoK ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [trial, paid]
    env:
      APP_VARIANT: ${{ matrix.variant }}
      EXPO_PUBLIC_APP_VARIANT: ${{ matrix.variant }}
      EXPO_PUBLIC_DISTRIBUTION_CHANNEL: direct
      EXPO_NO_TELEMETRY: "1"
      RELEASE_VERSION: "0.5.7"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Validate licensed Adhan audio and prepare reliable WAV notification copies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p assets/adhan

          sources=(
            "assets/adhan/beautiful_adhan.ogg"
            "assets/adhan/adhan_morocco_hassan_ii.ogg"
            "assets/adhan/adhan_kazakhstan_shalqar.ogg"
            "assets/adhan/adhan_aaqib_azeez.ogg"
          )

          for f in "${sources[@]}"; do
            test -s "$f"
            echo "Checking $f"
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -show_entries format=duration -of default=noprint_wrappers=1 "$f"
          done

          # Expo recommends WAV for custom notification sounds. Keep OGG for
          # in-app preview and generate mono PCM WAV for native Android channels.
          ffmpeg -hide_banner -loglevel error -y -i assets/adhan/beautiful_adhan.ogg -vn -ac 1 -ar 44100 -c:a pcm_s16le assets/adhan/beautiful_adhan.wav
          ffmpeg -hide_banner -loglevel error -y -i assets/adhan/adhan_morocco_hassan_ii.ogg -vn -ac 1 -ar 44100 -c:a pcm_s16le assets/adhan/adhan_morocco_hassan_ii.wav
          ffmpeg -hide_banner -loglevel error -y -i assets/adhan/adhan_kazakhstan_shalqar.ogg -vn -ac 1 -ar 44100 -c:a pcm_s16le assets/adhan/adhan_kazakhstan_shalqar.wav
          ffmpeg -hide_banner -loglevel error -y -i assets/adhan/adhan_aaqib_azeez.ogg -vn -ac 1 -ar 44100 -c:a pcm_s16le assets/adhan/adhan_aaqib_azeez.wav

          for f in assets/adhan/*.wav; do
            test -s "$f"
            ffprobe -v error "$f" >/dev/null
          done

      - name: Validate translation completeness
        run: npm run check:translations

      - name: Run final release QA
        run: npm run check:release

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Keep build for internal verification
        uses: actions/upload-artifact@v4
        with:
          name: alofok-${{ matrix.variant }}-0.5.7
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish APK download links
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Download both APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: alofok-*-0.5.7
          path: artifacts

      - name: Prepare clear APK filenames
        run: |
          cp artifacts/alofok-trial-0.5.7/app-release.apk alofok-trial-0.5.7.apk
          cp artifacts/alofok-paid-0.5.7/app-release.apk alofok-plus-0.5.7.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.5.7 >/dev/null 2>&1 || gh release create v0.5.7 --title "الأفق 0.5.7" --notes "إصدار فحص نهائي: فصل التجريبية عن Plus، تدوير الثيمات حسب الوقت والأسبوع والشهر والفصل، إصلاح بقايا العربية في الواجهة الإنجليزية، إضافة دراسة أصحاب الكهف، وتثبيت أصوات أذان مرخصة مع فحص ملفات الصوت قبل البناء."
          gh release upload v0.5.7 alofok-trial-0.5.7.apk alofok-plus-0.5.7.apk --clobber
