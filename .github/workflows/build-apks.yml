name: Validate and build Android APKs

on:
  workflow_dispatch:
  push:
    paths:
      - .github/build-apks.trigger

permissions:
  contents: write

jobs:
  build-apk:
    name: Build AlofoK ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [trial, paid]
    env:
      APP_VARIANT: ${{ matrix.variant }}
      EXPO_PUBLIC_APP_VARIANT: ${{ matrix.variant }}
      EXPO_PUBLIC_DISTRIBUTION_CHANNEL: direct
      EXPO_NO_TELEMETRY: "1"
      RELEASE_VERSION: "1.0.0"
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Synchronize 1.0.0 release metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const version = JSON.parse(fs.readFileSync('app.json','utf8')).expo.version;
          const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          lock.version = version;
          if (lock.packages && lock.packages['']) lock.packages[''].version = version;
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          const appPath = 'src/app/AppV3.js';
          let app = fs.readFileSync(appPath,'utf8');
          app = app.replace(/const VERSION='[^']+';/, `const VERSION='${version}';`);
          fs.writeFileSync(appPath, app);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Fetch, convert, and validate the six approved Adhan recordings
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg librsvg2-bin fonts-noto-core
          mkdir -p assets/adhan /tmp/alofok-adhan

          convert_source() {
            local file_title="$1"
            local stem="$2"
            local encoded
            encoded=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$file_title")
            local url="https://commons.wikimedia.org/wiki/Special:Redirect/file/${encoded}"
            local input="/tmp/alofok-adhan/${stem}.source"
            echo "Downloading licensed source: ${file_title}"
            curl -fL --retry 4 --retry-delay 2 -A "AlofoK-build/1.0.0" "$url" -o "$input"
            test -s "$input"
            ffprobe -v error "$input" >/dev/null
            ffmpeg -hide_banner -loglevel error -xerror -y -fflags +genpts -i "$input" -vn -af "aresample=async=1:first_pts=0,asetpts=N/SR/TB" -ac 1 -ar 32000 -c:a libvorbis -q:a 5 "assets/adhan/${stem}.ogg"
            ffmpeg -hide_banner -loglevel error -xerror -y -fflags +genpts -i "$input" -vn -af "aresample=async=1:first_pts=0,asetpts=N/SR/TB" -ac 1 -ar 32000 -c:a pcm_s16le "assets/adhan/${stem}.wav"
          }

          test -s assets/adhan/beautiful_adhan.ogg
          ffprobe -v error assets/adhan/beautiful_adhan.ogg >/dev/null
          ffmpeg -hide_banner -loglevel error -xerror -y -i assets/adhan/beautiful_adhan.ogg -vn -ac 1 -ar 32000 -c:a pcm_s16le assets/adhan/beautiful_adhan.wav

          convert_source "Azan.ogg" "adhan_andrewler"
          convert_source "Adhan.ogg" "adhan_aishatu98"
          convert_source "Call to prayer.ogg" "adhan_nigeria_isaac"
          convert_source "33937 ejaz215 call-to-prayer-from-the-prophet-s-mo.ogg" "adhan_medina_ejaz215"
          convert_source "Adhan, Great Mosque of Mecca - Jan 21, 2013.webm" "adhan_mecca_2013"

          for stem in beautiful_adhan adhan_andrewler adhan_aishatu98 adhan_nigeria_isaac adhan_medina_ejaz215 adhan_mecca_2013; do
            for ext in ogg wav; do
              f="assets/adhan/${stem}.${ext}"
              test -s "$f"
              ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -show_entries format=duration -of default=noprint_wrappers=1 "$f"
              ffmpeg -hide_banner -loglevel error -xerror -i "$f" -f null -
            done
          done

      - name: Render approved launcher icons
        shell: bash
        run: |
          set -euo pipefail
          rsvg-convert -w 1024 -h 1024 assets/icons/icon-trial-approved.svg -o assets/icon-trial.png
          rsvg-convert -w 1024 -h 1024 assets/icons/icon-paid-approved.svg -o assets/icon-paid.png
          for name in icon-trial icon-paid; do
            file "assets/${name}.png"
            ffprobe -v error "assets/${name}.png" >/dev/null
            ffmpeg -hide_banner -loglevel error -xerror -i "assets/${name}.png" -f null -
          done

      - name: Validate translation completeness
        run: npm run check:translations

      - name: Run final release QA
        run: npm run check:release

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Keep build for internal verification
        uses: actions/upload-artifact@v4
        with:
          name: alofok-${{ matrix.variant }}-1.0.0
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish APK download links
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Download both APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: alofok-*-1.0.0
          path: artifacts

      - name: Prepare clear APK filenames
        run: |
          cp artifacts/alofok-trial-1.0.0/app-release.apk alofok-trial-1.0.0.apk
          cp artifacts/alofok-paid-1.0.0/app-release.apk alofok-plus-1.0.0.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 --repo 1984w18m11-byte/alofok-app >/dev/null 2>&1 || gh release create v1.0.0 --repo 1984w18m11-byte/alofok-app --title "الأفق 1.0.0" --notes "أول إصدار عام لإعادة بناء الأفق الجديدة: النسخة التجريبية ونسخة Plus، الواجهة الجديدة، GPS ومواقيت الصلاة، اللغات، الثيمات، و6 أصوات أذان معتمدة."
          gh release upload v1.0.0 alofok-trial-1.0.0.apk alofok-plus-1.0.0.apk --repo 1984w18m11-byte/alofok-app --clobber
