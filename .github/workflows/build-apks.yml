name: Build installable Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    name: Build AlOfoq Android APK
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: trial
      EXPO_PUBLIC_APP_VARIANT: trial
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p deliverables
          cp android/app/build/outputs/apk/release/app-release.apk deliverables/alofok.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: alofok-android-apk
          path: deliverables/alofok.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish direct-download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.2 deliverables/alofok.apk             --title "الأفق 0.2.2"             --notes "نسخة Android قابلة للتثبيت مع الأيقونة الذهبية الجديدة وإصلاح إعدادات البناء."
