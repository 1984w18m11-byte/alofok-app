name: Build installable Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build ${{ matrix.variant }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: trial
            filename: alofok-trial.apk

    env:
      APP_VARIANT: ${{ matrix.variant }}
      EXPO_PUBLIC_APP_VARIANT: ${{ matrix.variant }}
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Create valid trial icon
        run: |
          python3 - <<'PY'
          import math, pathlib, struct, zlib
          W=H=1024
          bg=(6,51,74)
          gold=(229,181,87)
          light=(250,220,145)
          px=[list(bg) for _ in range(W*H)]
          def put(x,y,c):
              if 0<=x<W and 0<=y<H: px[y*W+x]=list(c)
          def rect(x0,y0,x1,y1,c):
              for y in range(max(0,y0),min(H,y1)):
                  for x in range(max(0,x0),min(W,x1)): put(x,y,c)
          def circle(cx,cy,r,c):
              rr=r*r
              for y in range(max(0,cy-r),min(H,cy+r+1)):
                  dx=int(math.sqrt(max(0,rr-(y-cy)**2)))
                  for x in range(max(0,cx-dx),min(W,cx+dx+1)): put(x,y,c)
          circle(512,512,470,(7,38,55))
          circle(315,280,150,gold)
          circle(365,235,145,(7,38,55))
          rect(255,570,769,810,gold)
          circle(512,570,175,gold)
          rect(337,570,687,690,gold)
          rect(210,465,275,810,light)
          rect(749,465,814,810,light)
          circle(242,465,33,light)
          circle(781,465,33,light)
          rect(226,385,258,465,gold)
          rect(765,385,797,465,gold)
          for cx in (395,512,629):
              rect(cx-30,650,cx+30,810,(7,38,55))
              circle(cx,650,30,(7,38,55))
          raw=b''.join(b'\x00'+bytes(sum(px[y*W:(y+1)*W],[])) for y in range(H))
          def chunk(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',W,H,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')
          pathlib.Path('assets/icon-trial.png').write_bytes(png)
          print('Created valid 1024x1024 trial icon')
          PY

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build signed debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p deliverables
          cp android/app/build/outputs/apk/debug/app-debug.apk "deliverables/${{ matrix.filename }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alofok-${{ matrix.variant }}-apk
          path: deliverables/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 14
