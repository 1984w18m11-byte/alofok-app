name: Validate and build Android APKs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build AlOfoq ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [trial, paid]
    env:
      APP_VARIANT: ${{ matrix.variant }}
      EXPO_PUBLIC_APP_VARIANT: ${{ matrix.variant }}
      EXPO_PUBLIC_DISTRIBUTION_CHANNEL: direct
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Report translation completeness for preview
        continue-on-error: true
        run: npm run check:translations

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Keep build for internal verification
        uses: actions/upload-artifact@v4
        with:
          name: alofok-${{ matrix.variant }}-0.5.5
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish APK download links
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Download both APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: alofok-*-0.5.5
          path: artifacts

      - name: Prepare clear APK filenames
        run: |
          cp artifacts/alofok-trial-0.5.5/app-release.apk alofok-trial-0.5.5.apk
          cp artifacts/alofok-paid-0.5.5/app-release.apk alofok-plus-0.5.5.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.5.5 >/dev/null 2>&1 || gh release create v0.5.5 --title "الأفق 0.5.5" --notes "نسختا الأفق التجريبية والأفق بلس لفحصهما على أندرويد."
          gh release upload v0.5.5 alofok-trial-0.5.5.apk alofok-plus-0.5.5.apk --clobber
