name: Validate and build Android APKs

on:
  workflow_dispatch:
  push:
    paths:
      - .github/build-apks.trigger

permissions:
  contents: write

jobs:
  build-apk:
    name: Build AlofoK ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [trial, paid]
    env:
      APP_VARIANT: ${{ matrix.variant }}
      EXPO_PUBLIC_APP_VARIANT: ${{ matrix.variant }}
      EXPO_PUBLIC_DISTRIBUTION_CHANNEL: direct
      EXPO_NO_TELEMETRY: "1"
      RELEASE_VERSION: "0.5.7"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Refresh and validate licensed Adhan audio
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p assets/adhan /tmp/alofok-adhan

          convert_source() {
            local url="$1"
            local stem="$2"
            local input="/tmp/alofok-adhan/${stem}.source"
            echo "Downloading licensed source for ${stem}"
            curl -fL --retry 3 --retry-delay 2 -A "AlofoK-build/0.5.7" "$url" -o "$input"
            test -s "$input"
            ffprobe -v error "$input" >/dev/null
            # Some WebM sources contain discontinuous container timestamps. Rebuild
            # audio timestamps from the decoded samples so both OGG and WAV are clean.
            ffmpeg -hide_banner -loglevel error -xerror -y -fflags +genpts -i "$input" -vn -af "aresample=async=1:first_pts=0,asetpts=N/SR/TB" -ac 1 -ar 44100 -c:a libvorbis -q:a 5 "assets/adhan/${stem}.ogg"
            ffmpeg -hide_banner -loglevel error -xerror -y -fflags +genpts -i "$input" -vn -af "aresample=async=1:first_pts=0,asetpts=N/SR/TB" -ac 1 -ar 44100 -c:a pcm_s16le "assets/adhan/${stem}.wav"
          }

          # Beautiful adhan is already the original CC0 OGG bundled in the repo.
          test -s assets/adhan/beautiful_adhan.ogg
          ffprobe -v error assets/adhan/beautiful_adhan.ogg >/dev/null
          ffmpeg -hide_banner -loglevel error -xerror -y -i assets/adhan/beautiful_adhan.ogg -vn -ac 1 -ar 44100 -c:a pcm_s16le assets/adhan/beautiful_adhan.wav

          convert_source "https://commons.wikimedia.org/wiki/Special:Redirect/file/Llamada_a_oraci%C3%B3n_Mezquita_Hassan_II.wav" "adhan_morocco_hassan_ii"
          convert_source "https://commons.wikimedia.org/wiki/Special:Redirect/file/Adhan_in_Shalqar_mosque.webm" "adhan_kazakhstan_shalqar"
          convert_source "https://commons.wikimedia.org/wiki/Special:Redirect/file/The_Adhan_-_Muslim_Call_to_Prayer_-_Aaqib_Azeez.mp3" "adhan_aaqib_azeez"

          for f in \
            assets/adhan/beautiful_adhan.ogg \
            assets/adhan/adhan_morocco_hassan_ii.ogg \
            assets/adhan/adhan_kazakhstan_shalqar.ogg \
            assets/adhan/adhan_aaqib_azeez.ogg \
            assets/adhan/beautiful_adhan.wav \
            assets/adhan/adhan_morocco_hassan_ii.wav \
            assets/adhan/adhan_kazakhstan_shalqar.wav \
            assets/adhan/adhan_aaqib_azeez.wav; do
            test -s "$f"
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -show_entries format=duration -of default=noprint_wrappers=1 "$f"
            ffmpeg -hide_banner -loglevel error -xerror -i "$f" -f null -
          done

      - name: Validate translation completeness
        run: npm run check:translations

      - name: Run final release QA
        run: npm run check:release

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Keep build for internal verification
        uses: actions/upload-artifact@v4
        with:
          name: alofok-${{ matrix.variant }}-0.5.7
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish APK download links
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Download both APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: alofok-*-0.5.7
          path: artifacts

      - name: Prepare clear APK filenames
        run: |
          cp artifacts/alofok-trial-0.5.7/app-release.apk alofok-trial-0.5.7.apk
          cp artifacts/alofok-paid-0.5.7/app-release.apk alofok-plus-0.5.7.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.5.7 >/dev/null 2>&1 || gh release create v0.5.7 --title "الأفق 0.5.7" --notes "إصدار فحص نهائي: فصل التجريبية عن Plus، تدوير الثيمات حسب الوقت والأسبوع والشهر والفصل، إصلاح بقايا العربية في الواجهة الإنجليزية، إضافة دراسة أصحاب الكهف، وتثبيت أصوات أذان مرخصة مع إعادة جلب المصدر وفحص ملف الصوت كاملًا قبل كل بناء."
          gh release upload v0.5.7 alofok-trial-0.5.7.apk alofok-plus-0.5.7.apk --clobber
