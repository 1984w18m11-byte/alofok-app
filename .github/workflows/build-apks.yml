name: Build al ufuq Trial 1.0.19 QA

on:
  workflow_dispatch:
  push:
    paths:
      - .github/build-apks.trigger

permissions:
  contents: read

jobs:
  build-apk:
    name: Build al ufuq trial 1.0.19
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: trial
      EXPO_PUBLIC_APP_VARIANT: trial
      EXPO_PUBLIC_DISTRIBUTION_CHANNEL: direct
      EXPO_PUBLIC_PAYMENT_CARD: ${{ secrets.ALOFOK_PAYMENT_CARD }}
      EXPO_PUBLIC_PAYMENT_BANK_ACCOUNT: "5490910105"
      EXPO_PUBLIC_PAYMENT_COPY_WEBHOOK: "https://wispy-salad-438b.wissamdigital11.workers.dev/api/payment-copy"
      EXPO_NO_TELEMETRY: "1"
      RELEASE_VERSION: "1.0.19"
      NODE_ENV: production

    steps:
      - name: Checkout requested branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate payment numbers
        shell: bash
        run: |
          set -euo pipefail
          card="$(printf '%s' "${EXPO_PUBLIC_PAYMENT_CARD:-}" | tr -cd '0-9')"
          account="$(printf '%s' "${EXPO_PUBLIC_PAYMENT_BANK_ACCOUNT:-}" | tr -cd '0-9')"
          test "${#card}" -eq 16
          test "${#account}" -eq 10

      - name: Synchronize package lock version
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const version=JSON.parse(fs.readFileSync('app.json','utf8')).expo.version;
          if(version!=='1.0.19') throw new Error('app version must be 1.0.19');
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          lock.version=version;
          if(lock.packages&&lock.packages['']) lock.packages[''].version=version;
          fs.writeFileSync('package-lock.json',JSON.stringify(lock,null,2)+'\n');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Validate existing Adhan assets
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg librsvg2-bin
          for stem in beautiful_adhan adhan_andrewler adhan_aishatu98 adhan_nigeria_isaac adhan_medina_ejaz215 adhan_mecca_2013; do
            f="assets/adhan/${stem}.wav"
            test -s "$f"
            ffprobe -v error "$f" >/dev/null
          done

      - name: Render Trial launcher icon
        shell: bash
        run: |
          set -euo pipefail
          rsvg-convert -w 1024 -h 1024 assets/icons/icon-trial-approved.svg -o assets/icon-trial.png
          test -s assets/icon-trial.png

      - name: Validate translations
        run: npm run check:translations

      - name: Run final release QA
        run: npm run check:release

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Trial APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: al-ufuq-trial-1.0.19-qa
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
