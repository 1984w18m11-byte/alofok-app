name: Build installable Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build ${{ matrix.variant }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: trial
            filename: alofok-trial.apk
          - variant: paid
            filename: alofok-paid.apk

    env:
      APP_VARIANT: ${{ matrix.variant }}
      EXPO_PUBLIC_APP_VARIANT: ${{ matrix.variant }}
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Repair PNG checksums
        run: |
          python3 - <<'PY'
          import pathlib, struct, zlib
          for name in ('assets/icon-trial.png','assets/icon-paid.png'):
              path=pathlib.Path(name)
              data=path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{name}: invalid PNG signature')
              out=bytearray(data[:8])
              pos=8
              while pos < len(data):
                  length=struct.unpack('>I',data[pos:pos+4])[0]
                  kind=data[pos+4:pos+8]
                  payload=data[pos+8:pos+8+length]
                  if len(payload) != length:
                      raise SystemExit(f'{name}: truncated PNG chunk')
                  out += struct.pack('>I',length)+kind+payload+struct.pack('>I',zlib.crc32(kind+payload)&0xffffffff)
                  pos += 12+length
                  if kind == b'IEND':
                      break
              path.write_bytes(out)
              print(f'Repaired {name}')
          PY

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build signed debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p deliverables
          cp android/app/build/outputs/apk/debug/app-debug.apk "deliverables/${{ matrix.filename }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alofok-${{ matrix.variant }}-apk
          path: deliverables/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 14
