name: Verify permanent Wissam Digital al ufuq download link

on:
  push:
    paths:
      - '.github/site-release.trigger'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Keep public pages on the permanent download route
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=[
            Path('wissam-digital-site/public/index.html'),
            Path('wissam-digital-site/public/apps/alofok.html'),
          ]
          for p in files:
            s=p.read_text(encoding='utf-8')
            if '/download/alofok-trial' not in s:
              raise SystemExit(f'Permanent al ufuq download route is missing from {p}')
            s=s.replace('https://github.com/1984w18m11-byte/alofok-app/releases/download/v1.0.2/alofok-trial-1.0.2.apk','/download/alofok-trial')
            p.write_text(s,encoding='utf-8')
          PY

      - name: Mark Cloudflare source refresh
        shell: bash
        run: |
          printf '%s\n' 'Wissam Digital public pages use one permanent al ufuq download route.' > wissam-digital-site/.permanent-download-link.txt

      - name: Commit website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wissam-digital-site/public/index.html wissam-digital-site/public/apps/alofok.html wissam-digital-site/.permanent-download-link.txt
          git diff --cached --quiet && exit 0
          git commit -m "site: keep permanent al ufuq download route"
          git push origin main
