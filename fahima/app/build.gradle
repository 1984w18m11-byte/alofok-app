plugins { id 'com.android.application' }

android {
    namespace 'com.wissamdigital.fahima'
    compileSdk 35
    defaultConfig {
        applicationId 'com.wissamdigital.fahima'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
