    <text x="512" y="690" font-family="Noto Kufi Arabic, Noto Sans Arabic, sans-serif" font-size="128" font-weight="800" fill="url(#gold)" direction="rtl">الأفق بلاس</text>
    <text x="512" y="780" font-family="Noto Kufi Arabic, Noto Sans Arabic, sans-serif" font-size="50" font-weight="600" fill="#fff0c4" direction="rtl">تقويم عربي ثابت</text>
