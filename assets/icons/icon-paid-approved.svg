<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3b5"/><stop offset="0.22" stop-color="#f8cf68"/><stop offset="0.5" stop-color="#b56b15"/><stop offset="0.76" stop-color="#ffd87b"/><stop offset="1" stop-color="#8b4f10"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#061526" stop-opacity=".08"/><stop offset=".55" stop-color="#061526" stop-opacity=".16"/><stop offset="1" stop-color="#020914" stop-opacity=".92"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffd978" stop-opacity=".60"/><stop offset="1" stop-color="#ffd978" stop-opacity="0"/></radialGradient>
    <filter id="shadow"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dy="5"/><feComponentTransfer><feFuncA type="linear" slope=".7"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <mask id="crescent"><rect width="1024" height="1024" fill="black"/><circle cx="270" cy="260" r="205" fill="white"/><circle cx="337" cy="205" r="195" fill="black"/></mask>
    <clipPath id="round"><rect x="20" y="20" width="984" height="984" rx="190"/></clipPath>
  </defs>
  <rect width="1024" height="1024" rx="205" fill="#061526"/>
  <g clip-path="url(#round)">
    <image x="20" y="20" width="984" height="984" preserveAspectRatio="xMidYMid slice" xlink:href="../icon-paid-foreground.png"/>
    <rect x="20" y="20" width="984" height="984" fill="url(#shade)"/>
    <ellipse cx="300" cy="250" rx="330" ry="290" fill="url(#glow)" opacity=".45"/>
  </g>
  <rect x="24" y="24" width="976" height="976" rx="185" fill="none" stroke="#3d250b" stroke-width="28"/>
  <rect x="37" y="37" width="950" height="950" rx="172" fill="none" stroke="url(#gold)" stroke-width="18"/>
  <rect x="58" y="58" width="908" height="908" rx="152" fill="none" stroke="#f5ce72" stroke-opacity=".55" stroke-width="3"/>
  <g mask="url(#crescent)"><rect x="30" y="15" width="540" height="530" fill="url(#gold)"/></g>
  <circle cx="825" cy="165" r="12" fill="#fff0bd"/><circle cx="825" cy="165" r="42" fill="url(#glow)"/>
  <path d="M86 165 Q145 95 215 77 M809 77 Q879 95 938 165 M86 859 Q145 929 215 947 M809 947 Q879 929 938 859" fill="none" stroke="#dca94b" stroke-width="6" stroke-linecap="round" opacity=".9"/>
